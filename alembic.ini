[alembic]
# Path to the migration scripts. Relative paths are resolved from the
# directory that contains this file.
script_location = migrations

# Path that is prepended to sys.path so that the application package can be
# imported from migrations/env.py.
prepend_sys_path = .

# The database URL is injected at runtime from DATABASE_URL / NEON_DATABASE_URL /
# POSTGRES_URL by migrations/env.py (see resolve_database_url). Leave empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
